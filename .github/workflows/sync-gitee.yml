name: Sync Release to Gitee

on:
  workflow_run:
    workflows: ["Android Release", "Windows Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-gitee-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  sync-to-gitee:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')

    env:
      ALL_DONE: 'false'
      RELEASE_TAG: ''

    steps:
      - name: Wait for all release workflows
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = context.payload.workflow_run.head_sha;

            const workflowFiles = ['prepare-release.yml', 'release-android.yml', 'release-windows.yml'];

            for (const file of workflowFiles) {
              const { data: { workflow_runs: runs } } =
                await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: file,
                  head_sha: headSha,
                  status: 'completed',
                  per_page: 1,
                });

              if (!runs.length || runs[0].conclusion !== 'success') {
                core.info(`${file} not yet successful, skipping sync`);
                return;
              }
            }

            core.exportVariable('ALL_DONE', 'true');
            core.exportVariable('RELEASE_TAG', context.payload.workflow_run.head_branch);

      - name: Sync GitHub Repo to Gitee
        if: env.ALL_DONE == 'true'
        uses: wearerequired/git-mirror-action@v1
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GITEE_RSA_PRIVATE_KEY }}
        with:
          source-repo: git@github.com:${{ github.repository }}.git
          destination-repo: git@gitee.com:it-bill/BiCone.git

      - name: Wait for IPA on GitHub Release
        if: env.ALL_DONE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${RELEASE_TAG}"
          VERSION="${TAG#v}"
          IPA_NAME="BiCone-${VERSION}-unsigned.ipa"

          echo "Waiting for ${IPA_NAME} on release ${TAG}..."
          for i in $(seq 1 10); do
            if gh api "repos/${GH_REPO}/releases/tags/${TAG}" --jq '.assets[].name' | grep -Fxq "$IPA_NAME"; then
              echo "IPA found on release!"
              exit 0
            fi
            echo "IPA not found yet, retrying in 30s... ($i/10)"
            sleep 30
          done

          echo "Warning: IPA not found after 5 minutes, syncing without it"

      - name: Force sync current tag release to Gitee
        if: env.ALL_DONE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: it-bill
          GITEE_REPO: BiCone
        shell: bash
        run: |
          set -euo pipefail

          TAG="${RELEASE_TAG}"
          WORKDIR="$(mktemp -d)"
          ASSET_DIR="${WORKDIR}/assets"
          mkdir -p "${ASSET_DIR}"

          echo "Fetching GitHub release for tag ${TAG}..."
          gh api "repos/${GH_REPO}/releases/tags/${TAG}" > "${WORKDIR}/github_release.json"

          python3 - <<'PY' "${WORKDIR}/github_release.json" "${WORKDIR}"
          import json, sys, pathlib

          data = json.load(open(sys.argv[1], encoding='utf-8'))
          wd = pathlib.Path(sys.argv[2])

          (wd / "name.txt").write_text((data.get("name") or data["tag_name"]) + "\n", encoding="utf-8")
          (wd / "body.txt").write_text((data.get("body") or "-"), encoding="utf-8")
          (wd / "target_commitish.txt").write_text((data.get("target_commitish") or "master") + "\n", encoding="utf-8")

          with open(wd / "assets.txt", "w", encoding="utf-8") as f:
              for asset in data.get("assets", []):
                  f.write(asset["name"] + "\n")
          PY

          NAME="$(tr -d '\n' < "${WORKDIR}/name.txt")"
          TARGET_COMMITISH="$(tr -d '\n' < "${WORKDIR}/target_commitish.txt")"

          echo "GitHub release name: ${NAME}"
          echo "GitHub target_commitish: ${TARGET_COMMITISH}"

          echo "Checking whether Gitee release ${TAG} already exists..."
          HTTP_CODE="$(curl -sS \
            -o "${WORKDIR}/gitee_release.json" \
            -w "%{http_code}" \
            "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}")"

          echo "Gitee query HTTP status: ${HTTP_CODE}"
          echo "Gitee query response:"
          cat "${WORKDIR}/gitee_release.json"
          echo

          RELEASE_ID="$(
          python3 - <<'PY' "${WORKDIR}/gitee_release.json"
          import json, sys

          try:
              data = json.load(open(sys.argv[1], encoding='utf-8'))
          except Exception:
              print("")
              raise

          if isinstance(data, dict) and data.get("id"):
              print(data["id"])
          else:
              print("")
          PY
          )"

          wait_for_release_gone_by_id() {
            local release_id="$1"

            for i in $(seq 1 15); do
              CHECK_CODE="$(curl -sS -o /dev/null -w "%{http_code}" \
                "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${release_id}?access_token=${GITEE_TOKEN}")"
              if [ "${CHECK_CODE}" = "404" ]; then
                echo "Confirmed Gitee release ${release_id} is gone."
                return 0
              fi
              echo "Waiting Gitee release ${release_id} deletion to settle... (${i}/15, HTTP ${CHECK_CODE})"
              sleep 3
            done

            echo "Timed out waiting for Gitee release ${release_id} to disappear."
            return 1
          }

          find_oldest_deletable_release() {
            python3 - <<'PY' "${GITEE_OWNER}" "${GITEE_REPO}" "${GITEE_TOKEN}" "${TAG}" "${NEW_RELEASE_ID:-}"
          import json
          import sys
          import urllib.parse
          import urllib.request

          owner, repo, token, current_tag, keep_release_id = sys.argv[1:]
          page = 1
          candidates = []

          while True:
              query = urllib.parse.urlencode({
                  "access_token": token,
                  "page": page,
                  "per_page": 100,
              })
              url = f"https://gitee.com/api/v5/repos/{owner}/{repo}/releases?{query}"
              with urllib.request.urlopen(url) as resp:
                  data = json.load(resp)

              if not isinstance(data, list) or not data:
                  break

              for item in data:
                  release_id = str(item.get("id") or "")
                  tag_name = item.get("tag_name") or ""
                  created_at = item.get("created_at") or ""
                  if not release_id:
                      continue
                  if keep_release_id and release_id == keep_release_id:
                      continue
                  if tag_name == current_tag:
                      continue
                  candidates.append((created_at, release_id, tag_name))

              page += 1

          if not candidates:
              raise SystemExit(1)

          candidates.sort(key=lambda item: item[0])
          print("\t".join(candidates[0]))
          PY
          }

          delete_oldest_gitee_release() {
            local oldest_info
            local oldest_created_at
            local oldest_release_id
            local oldest_tag

            if ! oldest_info="$(find_oldest_deletable_release)"; then
              echo "No deletable old Gitee release found to free space."
              return 1
            fi

            IFS=$'\t' read -r oldest_created_at oldest_release_id oldest_tag <<< "${oldest_info}"

            if [ -z "${oldest_release_id}" ]; then
              echo "Failed to parse oldest Gitee release info."
              return 1
            fi

            echo "Deleting oldest Gitee release to free attachment space: tag=${oldest_tag:-<no-tag>}, id=${oldest_release_id}, created_at=${oldest_created_at}"
            curl -sS --fail -X DELETE \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${oldest_release_id}?access_token=${GITEE_TOKEN}" \
              >/dev/null

            wait_for_release_gone_by_id "${oldest_release_id}"
          }

          if [ "${HTTP_CODE}" = "200" ] && [ -n "${RELEASE_ID}" ]; then
            echo "Existing Gitee release found: ${RELEASE_ID}, deleting it first..."
            curl -sS --fail -X DELETE \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${RELEASE_ID}?access_token=${GITEE_TOKEN}" \
              >/dev/null
            wait_for_release_gone_by_id "${RELEASE_ID}"
          elif [ "${HTTP_CODE}" = "200" ] && [ -z "${RELEASE_ID}" ]; then
            echo "Gitee returned 200 but no valid release object for tag ${TAG}; treating as not found."
          elif [ "${HTTP_CODE}" = "404" ]; then
            echo "Gitee release ${TAG} does not exist yet."
          else
            echo "Unexpected response from Gitee when querying release by tag."
            exit 1
          fi

          echo "Creating fresh Gitee release for ${TAG}..."
          CREATE_HTTP_CODE="$(curl -sS \
            -o "${WORKDIR}/created_release.json" \
            -w "%{http_code}" \
            -X POST "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases" \
            --data-urlencode "access_token=${GITEE_TOKEN}" \
            --data-urlencode "tag_name=${TAG}" \
            --data-urlencode "name=${NAME}" \
            --data-urlencode "body@${WORKDIR}/body.txt" \
            --data-urlencode "target_commitish=${TARGET_COMMITISH}")"

          echo "Gitee create HTTP status: ${CREATE_HTTP_CODE}"
          echo "Gitee create response:"
          cat "${WORKDIR}/created_release.json"
          echo

          NEW_RELEASE_ID="$(
          python3 - <<'PY' "${WORKDIR}/created_release.json"
          import json, sys

          data = json.load(open(sys.argv[1], encoding='utf-8'))
          if isinstance(data, dict) and data.get("id"):
              print(data["id"])
          else:
              print("")
          PY
          )"

          if [ -z "${NEW_RELEASE_ID}" ]; then
            echo "Failed to create Gitee release for ${TAG}"
            exit 1
          fi

          echo "Created Gitee release id: ${NEW_RELEASE_ID}"

          echo "Waiting for new Gitee release to be queryable..."
          for i in $(seq 1 10); do
            CHECK_CODE="$(curl -sS -o /dev/null -w "%{http_code}" \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${NEW_RELEASE_ID}?access_token=${GITEE_TOKEN}")"
            if [ "${CHECK_CODE}" = "200" ]; then
              echo "New release is ready for asset uploads."
              break
            fi
            echo "Release not ready yet (HTTP ${CHECK_CODE}), retrying... (${i}/10)"
            sleep 3
          done

          if [ ! -s "${WORKDIR}/assets.txt" ]; then
            echo "No assets found on GitHub release ${TAG}, done."
            exit 0
          fi

          upload_asset() {
            local asset_name="$1"
            local upload_url="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${NEW_RELEASE_ID}/attach_files?access_token=${GITEE_TOKEN}"
            local resp_file="${WORKDIR}/upload_${asset_name}.json"
            local http_code=""
            local transient_attempt=0
            local cleanup_round=0

            while true; do
              transient_attempt=$((transient_attempt + 1))

              http_code="$(curl -sS \
                -o "${resp_file}" \
                -w "%{http_code}" \
                -X POST "${upload_url}" \
                -F "file=@${ASSET_DIR}/${asset_name}")"

              if [ "${http_code}" = "201" ] || [ "${http_code}" = "200" ]; then
                echo "Upload success for ${asset_name} (HTTP ${http_code})"
                return 0
              fi

              echo "Upload failed for ${asset_name} (attempt ${transient_attempt}, HTTP ${http_code})"
              echo "Gitee upload response:"
              cat "${resp_file}" || true
              echo

              if [ "${http_code}" = "400" ] && grep -Eq '附件配额|quota' "${resp_file}"; then
                cleanup_round=$((cleanup_round + 1))
                echo "Detected Gitee attachment quota exhaustion while uploading ${asset_name} (cleanup round ${cleanup_round})."

                if [ "${cleanup_round}" -gt 20 ]; then
                  echo "Exceeded cleanup safety limit while freeing Gitee attachment space."
                  return 1
                fi

                if delete_oldest_gitee_release; then
                  echo "Freed some Gitee space. Retrying ${asset_name} ..."
                  continue
                fi

                echo "Unable to free more Gitee attachment space for ${asset_name}."
                return 1
              fi

              if [ "${transient_attempt}" -ge 5 ]; then
                echo "Upload permanently failed for ${asset_name} after retries."
                return 1
              fi

              sleep $((transient_attempt * 2))
            done
          }

          echo "Downloading and uploading assets for ${TAG} only..."
          while IFS= read -r asset; do
            [ -n "${asset}" ] || continue

            echo "Downloading ${asset} ..."
            rm -f "${ASSET_DIR}/${asset}"
            gh release download "${TAG}" --pattern "${asset}" --dir "${ASSET_DIR}"

            echo "Uploading ${asset} ..."
            upload_asset "${asset}"
          done < "${WORKDIR}/assets.txt"

          echo "Release ${TAG} synced to Gitee successfully."
